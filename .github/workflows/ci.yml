# Continuous integration: tests, type check, static build, Terraform checks,
# a Docker build (not pushed) and a secret scan. It deploys nothing, calls no
# cloud API and uses no repository secrets, so pull requests from forks get
# nothing they could leak.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job can only read the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main
# are never cancelled, so every commit on main gets a full result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: consultrag
          POSTGRES_PASSWORD: consultrag
          POSTGRES_DB: consultrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consultrag -d consultrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway credentials for the service container above only.
      DATABASE_URL: postgresql://consultrag:consultrag@localhost:5432/consultrag
      # The tests use HashEmbedder. If any test tried to download a model,
      # these make it fail loudly instead of downloading.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      # tests/test_terraform_hosting.py runs `terraform test` and would be
      # skipped without the CLI, so it is installed here too.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install dependencies
        run: |
          # CPU-only PyTorch first, as in docker/api/Dockerfile; otherwise
          # sentence-transformers pulls the much larger GPU build.
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-api.txt

      - name: Run the full test suite
        run: python -m pytest -q -rs -p no:cacheprovider --junitxml=pytest-results.xml

      - name: Fail if any test was skipped
        # Every Postgres test skips itself when the database is unreachable,
        # so a skip here would mean those tests silently didn't run.
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{tests} tests, {skipped} skipped")
          if tests == 0 or skipped:
              sys.exit("No test may be skipped in CI (Postgres and Terraform are both available here).")
          EOF

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Static build
        env:
          # Harmless placeholders: public build-time values, not secrets.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          NEXT_PUBLIC_FALLBACK_ENGAGEMENTS: " "
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    env:
      # No credentials exist in this job; this also stops any attempt to use
      # the instance metadata service.
      AWS_EC2_METADATA_DISABLED: "true"
      CHECKPOINT_DISABLE: "1"
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test (mocked providers)
        # tests/plan.tftest.hcl plans the real configuration with mock_provider,
        # so no credentials are needed and nothing reaches AWS.
        run: terraform test

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the API image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          tags: consultrag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks (full history, values redacted)
        # Official image pinned by digest (gitleaks v8.30.1). --redact keeps
        # any matched value out of the log.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1

  ci-passed:
    name: CI passed
    # One stable check that is green only when all five jobs succeeded, so it
    # can later be the single required check.
    if: always()
    needs: [backend, frontend, terraform, docker, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
